<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera studio</title>
<style>
:root{--bg:#f4f4f1;--panel:#fff;--panel2:#f0efea;--fg:#1c1c1a;--mute:#6a6a64;--line:#dedcd4;--accent:#2f6f4f;--accent-fg:#fff;
  --warn:#b45309;--bad:#b91c1c;--good:#15803d;--sel:#2563eb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121311;--panel:#1b1c1a;--panel2:#232421;--fg:#ecebe6;--mute:#9a9a92;
  --line:#2f312c;--accent:#7fc29c;--accent-fg:#10140f;--warn:#f59e0b;--bad:#f87171;--good:#4ade80;--sel:#60a5fa}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--mute)}button:disabled{opacity:.45;cursor:default}
button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.on kbd,button.primary kbd{color:inherit;border-color:currentColor;opacity:.75}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
select,input[type=number],input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--mute);margin-left:4px}
.mute{color:var(--mute)}.warn{color:var(--warn)}.bad{color:var(--bad)}.good{color:var(--good)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0 6px 0 0;white-space:nowrap}
.group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sep{width:1px;align-self:stretch;background:var(--line)}
.spacer{flex:1}
.app{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;height:calc(100% - 50px);min-height:0}
aside{background:var(--panel);overflow:auto;padding:10px;min-height:0}
aside.left{border-right:1px solid var(--line)}aside.right{border-left:1px solid var(--line)}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:12px 0 6px}
aside h3:first-child{margin-top:0}
.cam{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.cam:hover{background:var(--panel2)}.cam.focus{border-color:var(--sel)}
.cam .dot{width:10px;height:10px;border-radius:50%;flex:none}
.cam .name{font-weight:600}.cam .chips{margin-left:auto;display:flex;gap:3px}
.chip{font-size:10.5px;border-radius:10px;padding:0 6px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.chip.good{color:var(--good)}.chip.warn{color:var(--warn)}
main{overflow:auto;padding:8px;min-height:0}
.panes{display:grid;gap:8px}
.panes.n1{grid-template-columns:1fr}.panes.n2{grid-template-columns:1fr 1fr}.panes.n4{grid-template-columns:1fr 1fr}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.pane.focus{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.ph{display:flex;align-items:center;gap:6px;padding:5px 7px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ph .info{margin-left:auto;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.ph input[type=range]{width:90px}
.view{overflow:auto;background:#000;position:relative}
.panes.n1 .view{max-height:calc(100vh - 140px)}.panes.n2 .view{max-height:calc(100vh - 140px)}.panes.n4 .view{max-height:calc(50vh - 80px)}
canvas{display:block;touch-action:none}
.inspector .row{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.inspector label{color:var(--mute)}
.inspector input[type=number]{width:78px}
.slider{display:grid;grid-template-columns:92px 1fr 52px;align-items:center;gap:6px;margin:3px 0}
.slider label{color:var(--mute)}.slider span{text-align:right;font-variant-numeric:tabular-nums}
.slider input{width:100%}.planecard{margin:6px 0;padding:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.card{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel)}
.card h4{margin:0 0 4px;font-size:13px}
.pairs div{display:flex;gap:6px;align-items:baseline;margin:2px 0}
.log div{font-size:12px;margin:3px 0;padding-left:8px;border-left:2px solid var(--line)}
.log div.good{border-color:var(--good)}.log div.warn{border-color:var(--warn)}.log div.bad{border-color:var(--bad)}
.hint{font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;font-size:12px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.planbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 14px;border-radius:8px;
  font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:.95}
@media (max-width:1000px){.app{grid-template-columns:1fr;height:auto}aside.left,aside.right{border:0;border-bottom:1px solid var(--line)}
  .panes.n2,.panes.n4{grid-template-columns:1fr}}
</style></head><body>
<header>
  <h1>Camera studio</h1>
  <div class="group" id="layouts" title="how many cameras at once, or the floor from above">
    <button data-layout="1">1</button><button data-layout="2">2</button><button data-layout="4">4</button><button data-layout="plan">Plan<kbd>P</kbd></button>
  </div>
  <div class="sep"></div>
  <div class="group" id="tools">
    <button data-tool="select" title="select and move anything: spots, corners, plane points">Select<kbd>V</kbd></button>
    <button data-tool="mask" title="the floor this camera counts">Mask<kbd>M</kbd></button>
    <button data-tool="exclude" title="greyed before the detector">Exclude<kbd>E</kbd></button>
    <button data-tool="tracking_mask" title="where the camera follows cows beyond its mask">Tracking<kbd>T</kbd></button>
    <button data-tool="spots" title="the same spot of the floor on every camera that sees it">Spots<kbd>S</kbd></button>
    <button data-tool="plane" title="the floor plane: tilt, turn, roll and place it">Plane<kbd>F</kbd></button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button data-toggle="grid" title="the floor grid on every calibrated camera">Grid<kbd>G</kbd></button>
    <button data-toggle="cows" title="the cows the detector found, coloured by the zones">Cows<kbd>C</kbd></button>
    <button data-toggle="autofit" title="fit the planes from the spots after each change">Auto-fit</button>
  </div>
  <div class="spacer"></div>
  <div class="group">
    <button id="undo" title="Ctrl+Z">Undo</button><button id="redo" title="Ctrl+Shift+Z">Redo</button>
    <button id="reload" title="drop every change since the last save">Revert</button>
    <button id="save" class="primary">Save</button>
    <span id="status" class="mute"></span>
  </div>
</header>
<div class="app">
  <aside class="left">
    <h3>Cameras</h3>
    <div id="camlist"></div>
    <div class="hint" style="margin-top:6px">Click a camera to show it in the highlighted view.</div>
    <div id="momentbox"></div>
    <h3>Legend</h3>
    <div class="legend">
      <span><i style="background:#3ee07a"></i>mask</span><span><i style="background:#4aa3ff"></i>tracking</span>
      <span><i style="background:#ff4040"></i>exclude</span><span><i style="background:#ffd400"></i>other camera's mask</span>
      <span><i style="background:#22d3ee"></i>floor grid</span>
    </div>
    <div class="legend">
      <span><b class="good">&#9679;</b>spot agrees</span><span><b class="warn">&#9679;</b>off a little</span><span><b class="bad">&#9679;</b>off</span>
      <span><b class="mute">&#9675;</b>where it should be</span>
    </div>
  </aside>
  <main id="main"></main>
  <aside class="right inspector" id="inspector"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const COL = {mask: "#3ee07a", exclude: "#ff4040", tracking_mask: "#4aa3ff"};
const CAMCOL = ["#22d3ee", "#f472b6", "#a3e635", "#fbbf24", "#a78bfa", "#fb7185", "#34d399", "#60a5fa"];
const LAYERS = ["mask", "exclude", "tracking_mask"];
const NAMES = {mask: "mask", exclude: "exclude", tracking_mask: "tracking zone"};

// ================================================================== geometry (as common.undistort / autocalib)
function undistort(u, v, k, ar) {
  const x = (u - 0.5) * ar, y = v - 0.5, s = 1 / (1 + k * (x * x + y * y) / (0.25 * ar * ar + 0.25));

}
function distort(u, v, k, ar) {
  if (!k) return [u, v];
  const x = (u - 0.5) * ar, y = v - 0.5, c = k / (0.25 * ar * ar + 0.25), ru = Math.hypot(x, y), cr = c * ru;
  let rd = ru;
  if (Math.abs(cr) > 1e-12) { const d = 1 - 4 * cr * ru; if (d < 0) return null; rd = (1 - Math.sqrt(d)) / (2 * cr); }
  const s = ru > 1e-12 ? rd / ru : 1;
  return [0.5 + x * s / ar, 0.5 + y * s];
}
const mul3 = (A, B) => A.map(r => [0, 1, 2].map(j => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
function inv3(m) {

  const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g, det = a * A + b * B + c * C;
  if (Math.abs(det) < 1e-18) return null;
  return [[A / det, -(b * i - c * h) / det, (b * f - c * e) / det],
          [B / det, (a * i - c * g) / det, -(a * f - c * d) / det],
          [C / det, -(a * h - b * g) / det, (a * e - b * d) / det]];
}
const apply3 = (H, x, y) => { const w = H[2][0] * x + H[2][1] * y + H[2][2]; return [(H[0][0] * x + H[0][1] * y + H[0][2]) / w, (H[1][0] * x + H[1][1] * y + H[1][2]) / w, w]; };
function solve(A, b) {
  const n = b.length, M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];

    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }

}
function normT(P) {

  const d = P.reduce((s, p) => s + Math.hypot(p[0] - cx, p[1] - cy), 0) / P.length || 1e-12, s = Math.SQRT2 / d;
  return [[s, 0, -s * cx], [0, s, -s * cy], [0, 0, 1]];
}
function homography(src, dst) {             // dst ~ H src, least squares (DLT, Hartley-normalised)
  const Ts = normT(src), Td = normT(dst), N = Array.from({length: 8}, () => new Array(8).fill(0)), r = new Array(8).fill(0);
  src.forEach((p, i) => {
    const [x, y] = apply3(Ts, p[0], p[1]), [u, v] = apply3(Td, dst[i][0], dst[i][1]);
    for (const [row, rhs] of [[[x, y, 1, 0, 0, 0, -u * x, -u * y], u], [[0, 0, 0, x, y, 1, -v * x, -v * y], v]])
      for (let a = 0; a < 8; a++) { r[a] += row[a] * rhs; for (let b = 0; b < 8; b++) N[a][b] += row[a] * row[b]; }
  });
  const h = solve(N, r); if (!h) return null;
  const Tdi = inv3(Td); if (!Tdi) return null;
  return mul3(mul3(Tdi, [[h[0], h[1], h[2]], [h[3], h[4], h[5]], [h[6], h[7], 1]]), Ts);
}
function model(c) {                         // a camera's plane: picture (0-1) <-> floor
  const key = JSON.stringify(c.calib);
  if (c._mk === key) return c._m;
  c._mk = key; c._m = null;
  const f = c.calib;
  if (!f || !f.floor_points || f.floor_points.length < 4) return null;
  const k = f.distortion || 0, ar = f.aspect || c.w / c.h, P = f.floor_points;
  const und = P.map(p => undistort(p[0], p[1], k, ar)), H = homography(und, P.map(p => [p[2], p[3]]));
  if (!H) return null;
  const Hi = inv3(H); if (!Hi) return null;
  const ws = und.map(([a, b]) => H[2][0] * a + H[2][1] * b + H[2][2]).sort((a, b) => a - b);
  c._m = {H, Hi, k, ar, front: Math.sign(ws[ws.length >> 1]) || 1};
  return c._m;
}
function toFloor(m, u, v) {
  const [a, b] = undistort(u, v, m.k, m.ar), q = apply3(m.H, a, b);
  return Math.sign(q[2]) === m.front && isFinite(q[0]) && isFinite(q[1]) ? [q[0], q[1]] : null;
}
function fromFloor(m, X, Y) {
  const q = apply3(m.Hi, X, Y);
  if (Math.sign(q[2]) !== m.front || !isFinite(q[0])) return null;
  const p = distort(q[0], q[1], m.k, m.ar);
  return p && isFinite(p[0]) && isFinite(p[1]) ? p : null;
}
function niceStep(r) { const e = Math.pow(10, Math.floor(Math.log10(r))); for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= r) return m * e; return 10 * e; }
const pct = (a, q) => a[Math.min(a.length - 1, Math.max(0, Math.floor(q * (a.length - 1))))];
function floorBox(c, m) {                   // what of the floor a camera sees (its mask / tracking zone when drawn)
  const zone = [...c.mask, ...c.tracking_mask].filter(p => p.length >= 3), xs = [], ys = [];
  for (let i = 0; i < 24; i++) for (let j = 0; j < 24; j++) {
    const u = 0.02 + 0.96 * i / 23, v = 0.02 + 0.96 * j / 23;
    if (zone.length && !zone.some(p => inPoly(u, v, p))) continue;
    const q = toFloor(m, u, v); if (q) { xs.push(q[0]); ys.push(q[1]); }
  }
  if (xs.length < 6) return null;
  xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
  return [pct(xs, 0.03), pct(ys, 0.03), pct(xs, 0.97), pct(ys, 0.97)];
}
function inPoly(x, y, p) { let ins = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
  const [x1, y1] = p[i], [x2, y2] = p[j]; if ((y1 > y) !== (y2 > y) && x < (x2 - x1) * (y - y1) / (y2 - y1 + 1e-12) + x1) ins = !ins; } return ins; }
function distSeg(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1e-12;
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); }

// ================================================================== the plane, moved as a whole
// A camera's plane is edited against where it stood when the editing began (its base): turned in the picture as the
// camera would turn about its centre (tilt, pan, roll, a nominal 90-degree lens), zoomed, its lens bend set; and moved,
// turned and scaled on the plan about the floor nearest the camera. At no change it is the base exactly - any plane
// works, also one fitted from spots that no real camera gives (a plan in about cm is not quite square).
const D2R = Math.PI / 180;
function rotM(a, b, g) {                     // Rz(roll) Ry(pan) Rx(tilt)
  const [ca, sa, cb, sb, cg, sg] = [Math.cos(a), Math.sin(a), Math.cos(b), Math.sin(b), Math.cos(g), Math.sin(g)];
  return mul3([[cg, -sg, 0], [sg, cg, 0], [0, 0, 1]], mul3([[cb, 0, sb], [0, 1, 0], [-sb, 0, cb]], [[1, 0, 0], [0, ca, -sa], [0, sa, ca]]));
}
const wrap = a => ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
const PLANE0 = k => ({tilt: 0, pan: 0, roll: 0, zoom: 1, k, dx: 0, dy: 0, turn: 0, scale: 1});
function editOf(c) {                         // the camera's editing, begun anew whenever its plane changed elsewhere
  const key = JSON.stringify(c.calib);
  if (c._ed && c._ed.key === key) return c._ed;
  const m = model(c); if (!m) { c._ed = null; return null; }
  const b = floorBox(c, m), near = toFloor(m, 0.5, 0.95) || (b ? [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2] : [0, 0]);
  c._ed = {key, H: m.H, ar: m.ar, front: m.front, pivot: near, k0: m.k, p: PLANE0(m.k)};
  return c._ed;
}
function planeOf(ed, p) {                    // the edited plane -> its floor_points, or null when the picture's bottom is no floor
  const ar = ed.ar, f0 = ar / 2, A = [[ar, 0, -ar / 2], [0, 1, -0.5], [0, 0, 1]], K = [[f0, 0, 0], [0, f0, 0], [0, 0, 1]];
  const Mxy = mul3(mul3(mul3(K, rotM(p.tilt, p.pan, p.roll)), inv3(K)), [[p.zoom, 0, 0], [0, p.zoom, 0], [0, 0, 1]]);
  const Mi = inv3(mul3(mul3(inv3(A), Mxy), A)); if (!Mi) return null;
  const [px, py] = ed.pivot, ct = Math.cos(p.turn) * p.scale, st = Math.sin(p.turn) * p.scale;
  const S = mul3([[1, 0, px + p.dx], [0, 1, py + p.dy], [0, 0, 1]], mul3([[ct, -st, 0], [st, ct, 0], [0, 0, 1]], [[1, 0, -px], [0, 1, -py], [0, 0, 1]]));
  const H = mul3(mul3(S, ed.H), Mi);
  const w = (u, v) => { const [a, b] = undistort(u, v, p.k, ar); return H[2][0] * a + H[2][1] * b + H[2][2]; };
  const ref = w(0.5, 0.97);
  if (Math.sign(ref) !== ed.front) return null;
  const ok = (u, v) => Math.sign(w(u, v)) === ed.front && Math.abs(w(u, v)) > 0.15 * Math.abs(ref);
  let top = null;
  for (let v = 0.02; v <= 0.95; v += 0.01) if (ok(0.1, v) && ok(0.5, v) && ok(0.9, v)) { top = v; break; }

  const v0 = Math.min(0.9, top + 0.02), pts = [];
  for (const u of [0.1, 0.5, 0.9]) for (const v of [v0, (v0 + 0.95) / 2, 0.95]) {
    const [a, b] = undistort(u, v, p.k, ar), q = apply3(H, a, b);
    pts.push([+u.toFixed(4), +v.toFixed(4), +q[0].toFixed(1), +q[1].toFixed(1)]);

}
function setPlane(c, p) {                    // a change to the plane (refused when it would put the sky at the picture's bottom)
  const ed = editOf(c); if (!ed) return false;

  c.calib = cal; ed.p = {...p}; ed.key = JSON.stringify(cal); floorDirty[c.id] = true; return true;

function planeMarker(c) {                    // where the camera's floor begins on the plan, and which way it looks
  const m = model(c); if (!m) return null;
  const near = toFloor(m, 0.5, 0.95); if (!near) return null;
  let far = null; for (let v = 0.6; v < 0.94 && !far; v += 0.04) far = toFloor(m, 0.5, v);
  return far ? {near, dir: Math.atan2(far[1] - near[1], far[0] - near[0])} : null;
}

// ================================================================== state
let S = null, cams = {}, order = [], spots = [], errors = {}, fitPairs = {}, floorDirty = {}, zonesChanged = new Set();
let linkDist = null, okPairs = new Set(), undoStack = [], redoStack = [], edits = 0, logLines = [];
let layout = "2", tool = "select", show = {grid: false, cows: true, autofit: true};
let panes = [0, 1, 2, 3].map(() => ({cam: null, over: "", alpha: 0.5, zoom: 1, ov: null}));
let focus = 0, sel = null, cur = null, drag = null, plan = null, planAlpha = 0.75, planHidden = new Set(), planDrag = null;
const camColor = id => CAMCOL[order.indexOf(id) % CAMCOL.length];
const spotById = id => spots.find(s => s.id === id);
const unitsCm = id => S.boxes_cached.includes(id);

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}
function say(lines, cls) {
  (Array.isArray(lines) ? lines : [lines]).forEach(t => logLines.unshift({t, cls}));
  logLines = logLines.slice(0, 40); inspector();

  el.innerHTML = parts.join("");
  el.querySelectorAll("[data-unspot]").forEach(b => b.onclick = () => { const s = spotById(sel.id); checkpoint(); delete s.at[b.dataset.unspot]; if (!Object.keys(s.at).length) { spots = spots.filter(x => x !== s); sel = null; } spotsEdited([b.dataset.unspot]); });
  if ($("delspot")) $("delspot").onclick = () => { const s = spotById(sel.id); checkpoint(); spots = spots.filter(x => x !== s); sel = null; spotsEdited(Object.keys(s.at)); };
  if ($("delpoly")) $("delpoly").onclick = () => { checkpoint(); cams[sel.cam][sel.layer].splice(sel.i, 1); const cid = sel.cam; sel = null; zonesEdited(cid); };
  if (ed) {
    let sliding = false;
    const val = k => +$("pc-" + k).value;
    const fromInputs = () => ({tilt: val("tilt") * D2R, pan: val("pan") * D2R, roll: val("roll") * D2R, zoom: 2 ** val("zoom"), k: val("k"),
                               turn: val("turn") * D2R, scale: 2 ** val("scale"), dx: +$("pc-dx").value, dy: +$("pc-dy").value});
    const live = () => {
      if (!sliding) { checkpoint(); sliding = true; }
      if (!setPlane(c, fromInputs())) { toast("that way the bottom of the picture is no floor"); return; }
      const deg = k => val(k).toFixed(1) + "\u00b0";
      const shown = {tilt: deg("tilt"), pan: deg("pan"), roll: deg("roll"), zoom: "\u00d7" + (2 ** val("zoom")).toFixed(2), k: val("k").toFixed(2),
                     turn: deg("turn"), scale: "\u00d7" + (2 ** val("scale")).toFixed(2)};
      for (const k in shown) $("pv-" + k).textContent = shown[k];
      recomputeErrors(); drawAll(); throttleOverlays(); camList();
    };
    const done = () => { if (sliding) { sliding = false; planEdited(id); } };
    el.querySelectorAll("[data-pc]").forEach(r => { r.oninput = live; r.onchange = done; });
    ["pc-dx", "pc-dy"].forEach(k => $(k).onchange = () => { live(); done(); });
    $("pc-reset").onclick = () => { checkpoint(); setPlane(c, PLANE0(editOf(c).k0)); planEdited(id); };
  }
  if ($("forget")) $("forget").onclick = () => { if (!confirm(`Remove ${id}'s plane? (written on Save)`)) return; checkpoint(); c.calib = null; floorDirty[id] = true; [...okPairs].forEach(k => { if (k.split(":").includes(id)) okPairs.delete(k); }); planEdited(id); };
  if ($("newplane")) $("newplane").onclick = () => { checkpoint(); c.calib = startPlane(c); floorDirty[id] = true; tool = "plane"; build(); planEdited(id);
    say(`${id}: a plane to start from - tilt, turn and place it (tool Plane, the sliders on the right), or spots shared with a calibrated camera fit it to the others`); };
  if ($("fitnow")) $("fitnow").onclick = () => fit([id]);
  el.querySelectorAll("[data-tool-go]").forEach(b => b.onclick = () => setTool(b.dataset.toolGo));
}
function startPlane(c) {                    // a trapezoid on the lower picture as a 10 x 6 m patch, clear of the other planes
  let x = 0;
  order.forEach(id => { const f = cams[id].calib; if (f && f.floor_points && id !== c.id) x = Math.max(x, ...f.floor_points.map(p => p[2])); });
  x = x ? Math.ceil((x + 100000) / 100000) * 100000 : 0;
  return {floor_points: [[0.3, 0.45, x, 0], [0.7, 0.45, x + 1000, 0], [0.95, 0.95, x + 1000, 600], [0.05, 0.95, x, 600]], distortion: 0, aspect: +(c.w / c.h).toFixed(4)};
}

// ================================================================== the bars, the keys
function setTool(t) { tool = t; cur = null; if (t !== "spots" && t !== "select" && sel && sel.kind === "spot") sel = null;
  document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === tool)); drawAll(); inspector(); }
document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll("[data-layout]").forEach(b => b.onclick = () => { layout = b.dataset.layout; cur = null; build(); });
document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => { show[b.dataset.toggle] = !show[b.dataset.toggle]; b.classList.toggle("on", show[b.dataset.toggle]);
  if (b.dataset.toggle === "autofit" && show.autofit) toast("auto-fit on: the planes follow the spots"); drawAll(); });
$("undo").onclick = undo; $("redo").onclick = redo;
$("reload").onclick = async () => { if (!edits || confirm("Drop every change since the last save?")) { await load(); toast("as in barn.toml"); } };
$("save").onclick = async () => {
  const camsOut = {}, floor = {};
  zonesChanged.forEach(id => camsOut[id] = {mask: cams[id].mask, exclude: cams[id].exclude, tracking_mask: cams[id].tracking_mask});
  for (const id in floorDirty) floor[id] = cams[id].calib;
  const pairs = [...okPairs].filter(k => k.split(":").every(id => cams[id] && cams[id].calib));
  try {
    toast("saving...");
    const r = await api("/api/save", {cams: camsOut, floor, spots: spots.filter(s => Object.keys(s.at).length), link_dist: pairs.length ? linkDist : null, calibrated_pairs: pairs});
    const keep = {layout, tool, panes: panes.map(p => ({cam: p.cam, over: p.over, alpha: p.alpha, zoom: p.zoom})), logLines};
    await load(r.state); layout = keep.layout; tool = keep.tool; keep.panes.forEach((p, i) => Object.assign(panes[i], p)); logLines = keep.logLines;
    say(r.said, "good"); build(); toast("saved to barn.toml");
  } catch (e) { say("not saved: " + e.message, "bad"); toast("not saved"); }
};
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === "s") { e.preventDefault(); $("save").click(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tools = {v: "select", m: "mask", e: "exclude", t: "tracking_mask", s: "spots", f: "plane"};
  if (tools[k]) return setTool(tools[k]);
  if (k === "g" || k === "c") { const b = document.querySelector(`[data-toggle="${k === "g" ? "grid" : "cows"}"]`); b.click(); return; }
  if (k === "p") { layout = layout === "plan" ? "2" : "plan"; build(); return; }
  if (["1", "2", "4"].includes(k)) { layout = k; build(); return; }
  if (e.key === "Enter" && cur) { closePoly(); return; }
  if (e.key === "Escape") { cur = null; sel = null; drawAll(); inspector(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && sel) {
    e.preventDefault();
    if (sel.kind === "poly") { checkpoint(); cams[sel.cam][sel.layer].splice(sel.i, 1); const cid = sel.cam; sel = null; zonesEdited(cid); }
    else if (sel.kind === "spot") {
      const s = spotById(sel.id), fc = panes[focus].cam; checkpoint();
      if (layout !== "plan" && s.at[fc] && Object.keys(s.at).length > 1) { delete s.at[fc]; spotsEdited([fc]); toast(`spot ${s.id} off ${fc}`); }
      else { spots = spots.filter(x => x !== s); sel = null; spotsEdited(Object.keys(s.at)); toast(`spot ${s.id} deleted`); }
    }
  }
});
window.addEventListener("beforeunload", e => { if (edits) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("resize", () => { if (layout === "plan") drawPlan(); else for (let i = 0; i < +layout; i++) if (panes[i].cv) size(i); });
load().catch(e => { document.body.insertAdjacentHTML("afterbegin", `<div style="padding:12px;color:#b91c1c">${esc(e.message)}</div>`); });
</script></body></html>
